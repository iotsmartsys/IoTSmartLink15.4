name: EKOM Implementation

run-name: "EKOM · ${{ inputs.working_branch }} · implementation"

on:
  workflow_dispatch:
    inputs:
      working_branch:
        description: Branch de trabalho
        required: true
        type: string

      architect_authorization:
        description: Ordem explícita do Arquiteto para implementar esta versão
        required: true
        type: boolean
        default: false

      authorized_by:
        description: Identidade do Arquiteto que emitiu a ordem
        required: true
        type: string

      allow_tests:
        description: Autoriza coleta ou execução de testes
        required: true
        type: boolean
        default: false

      allow_hardware:
        description: Autoriza flash, monitor ou hardware
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "ekom-implementation-${{ inputs.working_branch }}"
  cancel-in-progress: false

jobs:
  implement:
    name: Implementar especificação EKOM
    runs-on:
      group: codex-trusted-runners
      labels: codex-runner
    defaults:
      run:
        shell: bash
    outputs:
      baseline_head: ${{ steps.validate_identity.outputs.baseline_head }}
      analyzed_revision: ${{ steps.validate_identity.outputs.analyzed_revision }}
      change_id: ${{ steps.validate_identity.outputs.change_id }}
      specification_path: ${{ steps.validate_identity.outputs.specification_path }}
      analysis_report_path: ${{ steps.validate_identity.outputs.analysis_report_path }}
      execution_mode: ${{ steps.validate_identity.outputs.execution_mode }}
      review_report_path: ${{ steps.validate_identity.outputs.review_report_path }}
      reviewed_revision: ${{ steps.validate_identity.outputs.reviewed_revision }}
      implementation_report_path: ${{ steps.prepare_execution.outputs.implementation_report_path }}
      patch_sha256: ${{ steps.prepare_patch.outputs.patch_sha256 }}

    steps:
      - name: Validar ordem de implementação
        env:
          WORKING_BRANCH: ${{ inputs.working_branch }}
          ARCHITECT_AUTHORIZATION: ${{ inputs.architect_authorization }}
          AUTHORIZED_BY: ${{ inputs.authorized_by }}
          ALLOW_TESTS: ${{ inputs.allow_tests }}
          ALLOW_HARDWARE: ${{ inputs.allow_hardware }}
        run: |
          set -euo pipefail

          if [ "$ARCHITECT_AUTHORIZATION" != "true" ]; then
            echo "Implementação não iniciada: falta ordem explícita do Arquiteto."
            exit 1
          fi

          if [ -z "${AUTHORIZED_BY//[[:space:]]/}" ]; then
            echo "A ordem deve identificar o Arquiteto responsável."
            exit 1
          fi

          if [[ "$AUTHORIZED_BY" == *$'\n'* || "$AUTHORIZED_BY" == *$'\r'* ]]; then
            echo "A identidade do Arquiteto deve ocupar uma única linha."
            exit 1
          fi

          if [ "$ALLOW_TESTS" != "false" ]; then
            echo "O workflow de implementação não autoriza coleta nem execução de testes."
            exit 1
          fi

          if [ "$ALLOW_HARDWARE" != "false" ]; then
            echo "O workflow de implementação não autoriza flash, monitor nem hardware."
            exit 1
          fi

          case "$WORKING_BRANCH" in
            spec/*) ;;
            *)
              echo "A implementação deve usar uma branch spec/*."
              exit 1
              ;;
          esac

          git check-ref-format --branch "$WORKING_BRANCH" >/dev/null

      - name: Baixar a branch autorizada
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.working_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Autorizar workspace para o Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validar versão e análise Ready
        id: validate_identity
        env:
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          set -euo pipefail

          if [ "$(git branch --show-current)" != "$WORKING_BRANCH" ]; then
            echo "A branch baixada não corresponde à ordem."
            exit 1
          fi

          if ! git merge-base origin/main HEAD >/dev/null; then
            echo "A branch não possui ancestral comum com a main."
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "A implementação exige árvore de trabalho limpa."
            git status --short --untracked-files=all
            exit 1
          fi

          python3 - "$WORKING_BRANCH" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          working_branch, output_path, summary_path = sys.argv[1:]

          def git(*args, check=True):
              result = subprocess.run(
                  ["git", *args],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and result.returncode != 0:
                  message = result.stderr.strip() or result.stdout.strip()
                  raise RuntimeError(message or f"git {' '.join(args)} falhou")
              return result

          def slug_for(path):
              name = path.stem.lower().replace("_", "-")
              return re.sub(r"[^a-z0-9-]", "", name)

          def normalize_specification(text):
              return re.sub(
                  r"^(\*\*(?:Estado da implementação|Estado do workflow):\*\*).*$",
                  r"\1 <estado-operacional>",
                  text,
                  flags=re.MULTILINE,
              )

          def added_files_in_commit(revision):
              changes = git(
                  "diff-tree",
                  "--root",
                  "--no-commit-id",
                  "--name-status",
                  "-r",
                  revision,
              ).stdout.splitlines()
              added = []
              for change in changes:
                  fields = change.split("\t", 1)
                  if len(fields) == 2 and fields[0] == "A":
                      added.append(fields[1])
              return changes, added

          def validate_correction(
              specification_path,
              spec_slug,
              analysis_report_path,
              analyzed_revision,
          ):
              lineage = git("rev-list", "--parents", "-n", "1", "HEAD").stdout.split()
              if len(lineage) != 2:
                  raise ValueError(
                      "a correção exige que o HEAD de revisão possua um único pai direto"
                  )
              head_revision, reviewed_revision = lineage

              review_changes, review_additions = added_files_in_commit(head_revision)
              review_prefix = f"docs/reports/{spec_slug}/review/"
              review_paths = [
                  path
                  for path in review_additions
                  if path.startswith(review_prefix) and path.endswith(".md")
              ]
              if len(review_changes) != 1 or len(review_paths) != 1:
                  raise ValueError(
                      "o HEAD deve adicionar exclusivamente um relatório de revisão"
                  )

              review_path = Path(review_paths[0])
              review = review_path.read_text(encoding="utf-8")
              required_review_fields = (
                  "**Classe da fonte:** Relatório",
                  "**Papel:** Engenheiro Revisor",
              )
              missing = [field for field in required_review_fields if field not in review]
              if missing:
                  raise ValueError(f"relatório de revisão sem campo: {missing[0]}")
              if not re.search(
                  rf"^\*\*Especificação:\*\*\s*`{re.escape(str(specification_path))}`(?:\s+v\S+)?\s*$",
                  review,
                  re.MULTILINE,
              ):
                  raise ValueError("a revisão não identifica a especificação corrente")

              compact_review = " ".join(review.split())
              if not re.search(
                  r"\*\*Estado:\*\*\s*Concluído\b",
                  review,
                  re.MULTILINE,
              ):
                  raise ValueError("a revisão não está concluída")
              if "**Defeito de implementação.**" not in review:
                  raise ValueError("a revisão não classifica Defeito de implementação")
              if not re.search(
                  r"retorn\w*\s+ao\s+(?:estágio\s+de\s+)?Implementa(?:ção|dor)",
                  compact_review,
                  re.IGNORECASE,
              ):
                  raise ValueError("a revisão não devolve explicitamente ao Implementador")
              if not re.search(r"ordem original", compact_review, re.IGNORECASE):
                  raise ValueError("a revisão não preserva explicitamente a ordem original")
              if re.search(
                  r"\*\*(?:Defeito normativo|Defeito da especificação|Pré-requisito arquitetural)",
                  review,
                  re.IGNORECASE,
              ):
                  raise ValueError("a revisão também registra devolução fora da Implementação")

              confronted = re.search(
                  r"\bimplementação\s+`([0-9a-f]{7,40})`",
                  review,
                  re.IGNORECASE,
              )
              if not confronted:
                  raise ValueError("a revisão não identifica a implementação confrontada")
              confronted_revision = git(
                  "rev-parse",
                  f"{confronted.group(1)}^{{commit}}",
              ).stdout.strip()
              if confronted_revision != reviewed_revision:
                  raise ValueError("a revisão não confronta seu commit-pai direto")
              if f"-{reviewed_revision[:7]}-" not in review_path.name:
                  raise ValueError("o nome da revisão não identifica a implementação confrontada")

              _, implementation_additions = added_files_in_commit(reviewed_revision)
              implementation_prefix = f"docs/reports/{spec_slug}/implementation/"
              implementation_paths = [
                  path
                  for path in implementation_additions
                  if path.startswith(implementation_prefix) and path.endswith(".md")
              ]
              if len(implementation_paths) != 1:
                  raise ValueError(
                      "o commit revisado deve adicionar exatamente um relatório de implementação"
                  )

              implementation_path = Path(implementation_paths[0])
              implementation = git(
                  "show",
                  f"{reviewed_revision}:{implementation_path}",
              ).stdout
              required_implementation_fields = (
                  "**Classe da fonte:** Relatório",
                  "**Papel:** Engenheiro Implementador",
                  f"**Especificação:** `{specification_path}`",
                  f"**Revisão confrontada:** `{analyzed_revision}`",
                  f"**Análise de entrada:** `{analysis_report_path}`",
              )
              missing = [
                  field for field in required_implementation_fields
                  if field not in implementation
              ]
              if missing:
                  raise ValueError(
                      f"relatório da implementação revisada sem vínculo: {missing[0]}"
                  )

              return str(review_path), reviewed_revision

          specification_matches = []
          for path in sorted(Path("docs/specs").glob("*.md")):
              if f"spec/{slug_for(path)}" == working_branch:
                  specification_matches.append(path)

          if len(specification_matches) != 1:
              raise SystemExit(
                  "A branch deve corresponder a exatamente uma especificação em "
                  f"docs/specs/. Encontradas: {len(specification_matches)}"
              )

          specification_path = specification_matches[0]
          specification = specification_path.read_text(encoding="utf-8")
          id_match = re.search(
              r"^\*\*ID:\*\*\s*`([A-Za-z0-9][A-Za-z0-9._-]*)`\s*$",
              specification,
              re.MULTILINE,
          )
          if not id_match:
              raise SystemExit("A especificação não declara um ID EKOM válido.")
          change_id = id_match.group(1)

          spec_slug = slug_for(specification_path)
          report_dir = Path("docs/reports") / spec_slug / "analysis"
          candidates = sorted(
              report_dir.glob("*-implementability-analysis.md"),
              key=lambda path: path.name,
              reverse=True,
          )
          if not candidates:
              raise SystemExit("Nenhum relatório de análise foi encontrado para a especificação.")

          current_specification = normalize_specification(specification)
          rejected = []
          selected = None

          for report_path in candidates:
              try:
                  if git("ls-files", "--error-unmatch", str(report_path), check=False).returncode != 0:
                      raise ValueError("arquivo não versionado")

                  report = report_path.read_text(encoding="utf-8")
                  required_fields = (
                      "**Classe da fonte:** Relatório",
                      "**Papel:** Engenheiro Analista",
                      f"**Especificação:** `{specification_path}`",
                      "**Estado:** Concluído",
                  )
                  missing = [field for field in required_fields if field not in report]
                  if missing:
                      raise ValueError(f"campo obrigatório ausente: {missing[0]}")

                  revision_match = re.search(
                      r"^\*\*Revisão confrontada:\*\*\s*`([0-9a-f]{40})`\s*$",
                      report,
                      re.MULTILINE,
                  )
                  if not revision_match:
                      raise ValueError("revisão Git completa ausente")
                  analyzed_revision = revision_match.group(1)

                  classification_match = re.search(
                      r"^\*\*(?:Classificação principal|Classificação):\*\*\s*(.+?)\s*$",
                      report,
                      re.MULTILINE,
                  )
                  if not classification_match:
                      raise ValueError("classificação ausente")
                  classification = re.sub(
                      r"\*\*([^*\n]+)\*\*",
                      r"\1",
                      classification_match.group(1),
                  ).strip()
                  if git("cat-file", "-e", f"{analyzed_revision}^{{commit}}", check=False).returncode != 0:
                      raise ValueError("revisão analisada inexistente")
                  if git(
                      "merge-base",
                      "--is-ancestor",
                      analyzed_revision,
                      "HEAD",
                      check=False,
                  ).returncode != 0:
                      raise ValueError("revisão fora da linhagem atual")

                  analyzed_specification = git(
                      "show",
                      f"{analyzed_revision}:{specification_path}",
                  ).stdout
                  if normalize_specification(analyzed_specification) != current_specification:
                      raise ValueError("especificação alterada normativamente depois da análise")

                  short_revision = analyzed_revision[:7]
                  if f"-{short_revision}-" not in report_path.name:
                      raise ValueError("nome não corresponde à revisão confrontada")

                  selected = (report_path, analyzed_revision, classification)
                  break
              except (OSError, RuntimeError, ValueError) as error:
                  rejected.append(f"- {report_path}: {error}")

          if selected is None:
              details = "\n".join(rejected)
              raise SystemExit(
                  "Nenhum relatório formal é aplicável à branch atual.\n" + details
              )

          report_path, analyzed_revision, classification = selected
          if not re.fullmatch(r"Pronta(?:\s+\[`Ready`\])?", classification):
              raise SystemExit(
                  "A análise formal mais recente aplicável não possui "
                  f"classificação Ready: {report_path} ({classification})"
              )

          unanalyzed = git(
              "diff",
              "--name-only",
              f"{analyzed_revision}..HEAD",
              "--",
              ".",
              f":(exclude)docs/reports/{spec_slug}/analysis/**",
          ).stdout.strip()
          execution_mode = "initial"
          review_report_path = ""
          reviewed_revision = ""
          if unanalyzed:
              try:
                  review_report_path, reviewed_revision = validate_correction(
                      specification_path,
                      spec_slug,
                      report_path,
                      analyzed_revision,
                  )
                  execution_mode = "correction"
              except (OSError, RuntimeError, ValueError) as error:
                  raise SystemExit(
                      "A branch possui delta posterior ao Ready, mas não forma "
                      f"uma devolução válida da Revisão: {error}"
                  )

          baseline_head = git("rev-parse", "HEAD").stdout.strip()
          outputs = {
              "change_id": change_id,
              "specification_path": str(specification_path),
              "analysis_report_path": str(report_path),
              "analyzed_revision": analyzed_revision,
              "baseline_head": baseline_head,
              "execution_mode": execution_mode,
              "review_report_path": review_report_path,
              "reviewed_revision": reviewed_revision,
          }
          with Path(output_path).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")

          with Path(summary_path).open("a", encoding="utf-8") as summary:
              summary.write("\n## Gates de implementação\n\n")
              summary.write("- Ordem explícita: confirmada\n")
              summary.write(f"- Change ID derivado: `{change_id}`\n")
              summary.write(f"- Especificação derivada: `{specification_path}`\n")
              summary.write(f"- Ready aplicável: `{report_path}`\n")
              summary.write(f"- Revisão normativa: `{analyzed_revision}`\n")
              summary.write(f"- Modo: `{execution_mode}`\n")
              if review_report_path:
                  summary.write(f"- Revisão de entrada: `{review_report_path}`\n")
                  summary.write(f"- Implementação revisada: `{reviewed_revision}`\n")
              summary.write(f"- Baseline da branch: `{baseline_head}`\n")
              summary.write("- Árvore inicial: limpa\n")
          PY

      - name: Registrar ordem recebida
        env:
          CHANGE_ID: ${{ steps.validate_identity.outputs.change_id }}
          SPECIFICATION_PATH: ${{ steps.validate_identity.outputs.specification_path }}
          ANALYSIS_REPORT_PATH: ${{ steps.validate_identity.outputs.analysis_report_path }}
          EXECUTION_MODE: ${{ steps.validate_identity.outputs.execution_mode }}
          REVIEW_REPORT_PATH: ${{ steps.validate_identity.outputs.review_report_path }}
          REVIEWED_REVISION: ${{ steps.validate_identity.outputs.reviewed_revision }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
          AUTHORIZED_BY: ${{ inputs.authorized_by }}
        run: |
          {
            echo "## Ordem EKOM recebida"
            echo
            echo "- Change ID: \`$CHANGE_ID\`"
            echo "- Especificação: \`$SPECIFICATION_PATH\`"
            echo "- Análise Ready: \`$ANALYSIS_REPORT_PATH\`"
            echo "- Modo: \`$EXECUTION_MODE\`"
            if [ -n "$REVIEW_REPORT_PATH" ]; then
              echo "- Revisão de entrada: \`$REVIEW_REPORT_PATH\`"
              echo "- Implementação revisada: \`$REVIEWED_REVISION\`"
            fi
            echo "- Branch: \`$WORKING_BRANCH\`"
            echo "- Autorizada por: $AUTHORIZED_BY"
            echo "- Código e build canônico: autorizados"
            echo "- Coleta/execução de testes, flash, monitor e hardware: não autorizados"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Baixar diretrizes EKOM vigentes
        uses: actions/checkout@v5
        with:
          repository: iotsmartsys/EKM-guidelines
          ref: main
          path: .ekom-guidelines
          fetch-depth: 1
          persist-credentials: false

      - name: Isolar checkout auxiliar do delta
        run: |
          set -euo pipefail

          printf '%s\n' '/.ekom-guidelines/' >> .git/info/exclude

          STATUS="$(git status --porcelain --untracked-files=all)"
          if [ -n "$STATUS" ]; then
            echo "A árvore deixou de estar limpa após o checkout das diretrizes."
            printf '%s\n' "$STATUS"
            exit 1
          fi

      - name: Verificar ambiente canônico de build
        run: |
          set -euo pipefail

          ORIGINAL_PATH="$PATH"
          source "$IDF_PATH/export.sh"

          idf.py --version
          python3 --version

          IFS=':' read -r -a ACTIVE_PATH_ENTRIES <<< "$PATH"
          for ((INDEX=${#ACTIVE_PATH_ENTRIES[@]} - 1; INDEX >= 0; INDEX--)); do
            PATH_ENTRY="${ACTIVE_PATH_ENTRIES[$INDEX]}"
            case ":$ORIGINAL_PATH:" in
              *":$PATH_ENTRY:"*) ;;
              *) printf '%s\n' "$PATH_ENTRY" >> "$GITHUB_PATH" ;;
            esac
          done

          for VARIABLE_NAME in IDF_PYTHON_ENV_PATH OPENOCD_SCRIPTS ESP_ROM_ELF_DIR; do
            VARIABLE_VALUE="${!VARIABLE_NAME:-}"
            if [ -n "$VARIABLE_VALUE" ]; then
              printf '%s=%s\n' "$VARIABLE_NAME" "$VARIABLE_VALUE" >> "$GITHUB_ENV"
            fi
          done

      - name: Preparar identidade da execução
        id: prepare_execution
        env:
          SPECIFICATION_PATH: ${{ steps.validate_identity.outputs.specification_path }}
          BASELINE_HEAD: ${{ steps.validate_identity.outputs.baseline_head }}
        run: |
          set -euo pipefail

          SPEC_SLUG="$(basename "$SPECIFICATION_PATH" .md \
            | tr '[:upper:]' '[:lower:]' \
            | tr '_' '-' \
            | sed 's/[^a-z0-9-]//g')"
          RUN_TIMESTAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          BASELINE_SHORT="$(git rev-parse --short=7 "$BASELINE_HEAD")"
          REPORT_PATH="docs/reports/$SPEC_SLUG/implementation/${RUN_TIMESTAMP}-${BASELINE_SHORT}-${GITHUB_RUN_ID}-implementation.md"

          if [ -e "$REPORT_PATH" ]; then
            echo "O relatório de implementação já existe e não será sobrescrito."
            exit 1
          fi

          echo "implementation_report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

      - name: Executar implementação EKOM
        id: codex_implementation
        env:
          CODEX_PROMPT: |
            Assuma exclusivamente o papel EKOM de Engenheiro Implementador e
            implemente integralmente a versão autorizada abaixo.

            Leia integralmente, nesta ordem:
            1. AGENTS.md;
            2. .ekom-guidelines/roles/REGRAS-COMUNS.md;
            3. .ekom-guidelines/roles/ENGENHEIRO-IMPLEMENTADOR.md;
            4. a especificação autorizada;
            5. o relatório Ready aplicável;
            6. quando o modo for `correction`, o relatório de revisão de entrada;
            7. somente as fontes técnicas e normativas pertinentes.

            Os perfis canônicos governam a atuação. O pipeline já confirmou a
            identidade, a árvore limpa, a correspondência do Ready e a ordem
            explícita do Arquiteto, mas você deve interromper se descobrir que
            qualquer gate material é falso.

            O diretório `.ekom-guidelines/` é um checkout auxiliar somente para
            leitura, gerenciado pelo pipeline e excluído localmente do status do
            repositório principal. A presença dele não constitui delta nem árvore
            suja.

            Ordem explícita:
            - ID: ${{ steps.validate_identity.outputs.change_id }}
            - Especificação: ${{ steps.validate_identity.outputs.specification_path }}
            - Revisão normativa autorizada: ${{ steps.validate_identity.outputs.analyzed_revision }}
            - Relatório Ready: ${{ steps.validate_identity.outputs.analysis_report_path }}
            - Modo: ${{ steps.validate_identity.outputs.execution_mode }}
            - Relatório de revisão de entrada: ${{ steps.validate_identity.outputs.review_report_path }}
            - Implementação revisada: ${{ steps.validate_identity.outputs.reviewed_revision }}
            - Branch: ${{ inputs.working_branch }}
            - Autorizada por: ${{ inputs.authorized_by }}

            No modo `correction`, preserve o trabalho válido existente e
            reconcilie todos os achados materiais do relatório de revisão de
            entrada. Não presuma quantidade fixa de achados e não limite o
            confronto ao relatório: a especificação integral continua sendo o
            contrato. Se o relatório introduzir decisão normativa, arquitetural
            ou ampliação de escopo não autorizada, interrompa a obrigação afetada
            conforme o perfil.

            Operações autorizadas:
            - alterar código, configuração e conhecimento dentro do recorte;
            - criar, ampliar, reestruturar ou corrigir testes somente quando a
              especificação corrente os exigir explicitamente e os vincular a
              requisito ou critério de aceite;
            - inspecionar o delta;
            - executar os builds canônicos e proporcionais dos entregáveis
              construíveis materialmente afetados.

            Operações não autorizadas:
            - coletar ou executar testes;
            - flash, monitor ou hardware;
            - deploy, release, merge, tag ou integração;
            - instalar toolchain ou dependência persistente;
            - alterar qualquer arquivo em .github/ ou .ekom-guidelines/;
            - criar commit ou fazer push. O pipeline executará mecanicamente a
              entrega após validar e transferir exatamente o seu delta.

            O ESP-IDF 6.0.1 já está disponível. Não instale outra toolchain.
            Use variantes somente de build e nunca execute testes como efeito
            colateral. Registre comando, ambiente, target/configuração, resultado
            terminal e código de saída de cada build iniciado.

            Como primeiro efeito material, registre mecanicamente In Progress nas
            fontes operacionais previstas pelo projeto, sem alterar comportamento
            normativo. Implemente todos os requisitos da versão, preserve as
            restrições do Ready e não absorva decisão ausente ou pré-requisito
            arquitetural como escolha local.

            Produza como resposta final somente o corpo técnico do relatório,
            com exatamente estas seções, nesta ordem: `Gates`, `Escopo
            realizado`, `Decisões locais`, `Builds canônicos`, `Operações não
            executadas`, `Limitações e desvios` e `Handoff para revisão`.
            Cada seção deve usar um heading Markdown `##` sem numeração. Não
            inclua título nem metadados: o pipeline os acrescentará de forma
            determinística e registrará o relatório novo em:
            ${{ steps.prepare_execution.outputs.implementation_report_path }}

            Em `Builds canônicos`, cada build usa `### Build N` e registra
            `- Comando:`, `- Ambiente:`, `- Target/configuração:`, `- Resultado
            terminal:` e `- Código de saída:`. Em `Operações não executadas`,
            registre coleta/execução de testes, flash, monitor e hardware como
            `Not Executed`.
            Se implementação ou build obrigatório permanecer incompleto, mantenha
            o estado In Progress e registre a limitação; não converta ausência de
            evidência em sucesso.

            Preserve relatórios existentes. Não promova a especificação, não
            declare Done e não inicie Revisão. Termine com o delta coerente no
            workspace, o corpo técnico entregue como resposta final e todas as
            operações iniciadas em estado terminal. Não crie manualmente o
            relatório no workspace.
        run: |
          set -euo pipefail

          printf '%s\n' "$CODEX_PROMPT" | codex exec \
            --ephemeral \
            --model gpt-5.6-sol \
            --config 'model_reasoning_effort="high"' \
            --sandbox workspace-write \
            --output-last-message "$RUNNER_TEMP/ekom-implementation-handoff.md" \
            -

      - name: Preparar relatório versionado
        env:
          SOURCE_REPORT: ${{ runner.temp }}/ekom-implementation-handoff.md
          IMPLEMENTATION_REPORT_PATH: ${{ steps.prepare_execution.outputs.implementation_report_path }}
          CHANGE_ID: ${{ steps.validate_identity.outputs.change_id }}
          SPECIFICATION_PATH: ${{ steps.validate_identity.outputs.specification_path }}
          ANALYZED_REVISION: ${{ steps.validate_identity.outputs.analyzed_revision }}
          ANALYSIS_REPORT_PATH: ${{ steps.validate_identity.outputs.analysis_report_path }}
          EXECUTION_MODE: ${{ steps.validate_identity.outputs.execution_mode }}
          REVIEW_REPORT_PATH: ${{ steps.validate_identity.outputs.review_report_path }}
          REVIEWED_REVISION: ${{ steps.validate_identity.outputs.reviewed_revision }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
          AUTHORIZED_BY: ${{ inputs.authorized_by }}
        run: |
          set -euo pipefail

          if [ ! -s "$SOURCE_REPORT" ]; then
            echo "O Implementador não entregou o corpo técnico do relatório."
            exit 1
          fi

          REPORT_DIR="$(dirname "$IMPLEMENTATION_REPORT_PATH")"
          mkdir -p "$REPORT_DIR"
          RUN_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            printf '# Relatório de implementação — %s\n\n' "$CHANGE_ID"
            printf '**Classe da fonte:** Relatório\n\n'
            printf '**Papel:** Engenheiro Implementador\n\n'
            printf '**Especificação:** `%s`\n\n' "$SPECIFICATION_PATH"
            printf '**Revisão confrontada:** `%s`\n\n' "$ANALYZED_REVISION"
            printf '**Análise de entrada:** `%s`\n\n' "$ANALYSIS_REPORT_PATH"
            printf '**Modo da atuação:** `%s`\n\n' "$EXECUTION_MODE"
            if [ "$EXECUTION_MODE" = "correction" ]; then
              printf '**Revisão de entrada:** `%s`\n\n' "$REVIEW_REPORT_PATH"
              printf '**Implementação revisada:** `%s`\n\n' "$REVIEWED_REVISION"
            fi
            printf '**Estado:** Em andamento [`In Progress`]\n\n'
            printf '**Branch:** `%s`\n\n' "$WORKING_BRANCH"
            printf '**Ordem do Arquiteto:** %s\n\n' "$AUTHORIZED_BY"
            printf '**Execução do GitHub Actions:** `%s`\n\n' "$GITHUB_RUN_ID"
            printf '**Data da implementação:** `%s`\n\n' "$RUN_TIMESTAMP"
            printf '%s\n\n' '---'
            cat "$SOURCE_REPORT"
            printf '\n'
          } > "$IMPLEMENTATION_REPORT_PATH"

          python3 - "$IMPLEMENTATION_REPORT_PATH" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = [line.rstrip(" \t") for line in path.read_text(encoding="utf-8").splitlines()]
          path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Validar delta do Implementador
        env:
          BASELINE_HEAD: ${{ steps.validate_identity.outputs.baseline_head }}
          ANALYZED_REVISION: ${{ steps.validate_identity.outputs.analyzed_revision }}
          EXECUTION_MODE: ${{ steps.validate_identity.outputs.execution_mode }}
          REVIEW_REPORT_PATH: ${{ steps.validate_identity.outputs.review_report_path }}
          REVIEWED_REVISION: ${{ steps.validate_identity.outputs.reviewed_revision }}
          SPECIFICATION_PATH: ${{ steps.validate_identity.outputs.specification_path }}
          IMPLEMENTATION_REPORT_PATH: ${{ steps.prepare_execution.outputs.implementation_report_path }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$BASELINE_HEAD" ]; then
            echo "O Implementador criou commit, operação reservada ao pipeline."
            exit 1
          fi

          if [ ! -s "$IMPLEMENTATION_REPORT_PATH" ]; then
            echo "O Implementador não criou o relatório obrigatório."
            exit 1
          fi

          STATUS="$(git status --porcelain --untracked-files=all \
            | grep -vE '^\?\? \.ekom-guidelines/$' || true)"
          if [ -z "$STATUS" ]; then
            echo "O Implementador não produziu delta versionável."
            exit 1
          fi

          CHANGED_FILES_FILE="$RUNNER_TEMP/ekom-changed-files.txt"
          {
            git diff --name-only --diff-filter=ACDMRTUXB
            git diff --cached --name-only --diff-filter=ACDMRTUXB
            git ls-files --others --exclude-standard
          } | sort -u > "$CHANGED_FILES_FILE"

          while IFS= read -r path; do
            case "$path" in
              .ekom-guidelines/*) continue ;;
              .github/*|.env|.env.*|*.pem|*.key)
                echo "Delta contém arquivo proibido: $path"
                exit 1
                ;;
              docs/reports/*)
                if [ "$path" != "$IMPLEMENTATION_REPORT_PATH" ]; then
                  echo "Somente o novo relatório de implementação pode ser alterado: $path"
                  exit 1
                fi
                ;;
            esac

          done < "$CHANGED_FILES_FILE"

          if git show "HEAD:$SPECIFICATION_PATH" | grep -Eq \
            '^\*\*Estado da implementação:\*\*.*`?Not Started`?'; then
            if grep -Eq '^\*\*Estado da implementação:\*\*.*`?Not Started`?' \
              "$SPECIFICATION_PATH"; then
              echo "O primeiro efeito operacional In Progress não foi registrado."
              exit 1
            fi
          fi

          python3 tools/validate_ekom_documents.py . "$IMPLEMENTATION_REPORT_PATH"

          python3 - \
            "$IMPLEMENTATION_REPORT_PATH" \
            "$SPECIFICATION_PATH" \
            "$ANALYZED_REVISION" \
            "$EXECUTION_MODE" \
            "$REVIEW_REPORT_PATH" \
            "$REVIEWED_REVISION" <<'PY'
          import re
          import sys
          from pathlib import Path

          (
              report_path,
              specification_path,
              analyzed_revision,
              execution_mode,
              review_report_path,
              reviewed_revision,
          ) = sys.argv[1:]
          report = Path(report_path).read_text(encoding="utf-8")

          required_fields = (
              "**Classe da fonte:** Relatório",
              "**Papel:** Engenheiro Implementador",
              f"**Especificação:** `{specification_path}`",
              "**Revisão confrontada:**",
              f"**Modo da atuação:** `{execution_mode}`",
              "**Estado:**",
              "**Execução do GitHub Actions:**",
              "**Branch:**",
              "**Ordem do Arquiteto:**",
          )
          for field in required_fields:
              if field not in report:
                  raise SystemExit(f"Campo obrigatório ausente: {field}")

          if analyzed_revision not in report:
              raise SystemExit("O relatório não referencia a revisão normativa autorizada.")

          if execution_mode == "correction":
              correction_fields = (
                  f"**Revisão de entrada:** `{review_report_path}`",
                  f"**Implementação revisada:** `{reviewed_revision}`",
              )
              for field in correction_fields:
                  if field not in report:
                      raise SystemExit(f"Vínculo de correção ausente: {field}")
          elif execution_mode != "initial":
              raise SystemExit(f"Modo de implementação inválido: {execution_mode}")

          required_headings = (
              "Gates",
              "Escopo realizado",
              "Decisões locais",
              "Builds canônicos",
              "Operações não executadas",
              "Limitações e desvios",
              "Handoff para revisão",
          )
          headings = re.findall(r"^##\s+(.+?)\s*$", report, re.MULTILINE)
          if headings != list(required_headings):
              raise SystemExit("A estrutura do relatório de implementação está inválida.")

          builds_match = re.search(
              r"^##\s+Builds canônicos\s*$\n(.*?)(?=^##\s+|\Z)",
              report,
              re.MULTILINE | re.DOTALL,
          )
          builds = builds_match.group(1) if builds_match else ""
          build_entries = re.split(r"^###\s+Build\s+\d+\s*$", builds, flags=re.MULTILINE)
          build_entries = [entry.strip() for entry in build_entries if entry.strip()]
          declared_builds = re.findall(r"^###\s+Build\s+\d+\s*$", builds, re.MULTILINE)
          if not declared_builds or len(build_entries) != len(declared_builds):
              raise SystemExit("O relatório deve registrar ao menos um build canônico.")

          build_fields = (
              "Comando",
              "Ambiente",
              "Target/configuração",
              "Resultado terminal",
              "Código de saída",
          )
          for entry in build_entries:
              for field in build_fields:
                  if not re.search(rf"^-\s+{re.escape(field)}:\s*\S", entry, re.MULTILINE):
                      raise SystemExit(f"Build sem campo obrigatório: {field}")

          operations_match = re.search(
              r"^##\s+Operações não executadas\s*$\n(.*?)(?=^##\s+|\Z)",
              report,
              re.MULTILINE | re.DOTALL,
          )
          operations = operations_match.group(1) if operations_match else ""
          for operation in ("testes", "flash", "monitor", "hardware"):
              if not re.search(
                  rf"{operation}[^\n]*Not Executed",
                  operations,
                  re.IGNORECASE,
              ):
                  raise SystemExit(f"Operação sem estado Not Executed: {operation}")
          PY

          while IFS= read -r path; do
            case "$path" in
              *.md) python3 tools/validate_ekom_documents.py . "$path" ;;
            esac
          done < "$CHANGED_FILES_FILE"

          git diff --check

      - name: Preparar patch imutável da implementação
        id: prepare_patch
        env:
          IMPLEMENTATION_REPORT_PATH: ${{ steps.prepare_execution.outputs.implementation_report_path }}
        run: |
          set -euo pipefail

          CHANGED_FILES_FILE="$RUNNER_TEMP/ekom-changed-files.txt"

          if [ ! -s "$CHANGED_FILES_FILE" ]; then
            echo "A lista de arquivos validados está ausente ou vazia."
            exit 1
          fi

          while IFS= read -r path; do
            [ -n "$path" ] || continue

            case "$path" in
              .ekom-guidelines|.ekom-guidelines/*) continue ;;
            esac

            git add -A -- "$path"
          done < "$CHANGED_FILES_FILE"

          if [ "$(git diff --cached --name-status -- "$IMPLEMENTATION_REPORT_PATH")" != \
            "A	$IMPLEMENTATION_REPORT_PATH" ]; then
            echo "O relatório da execução deve ser um arquivo novo."
            exit 1
          fi

          if git diff --cached --name-status \
            | awk '$2 ~ /^docs\/reports\// && ($1 != "A") { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Relatório histórico foi alterado ou removido."
            exit 1
          fi

          git diff --cached --check

          PATCH_FILE="$RUNNER_TEMP/ekom-implementation.patch"
          git diff --cached --binary --full-index > "$PATCH_FILE"

          if [ ! -s "$PATCH_FILE" ]; then
            echo "O patch de implementação ficou vazio."
            exit 1
          fi

          PATCH_SHA256="$(sha256sum "$PATCH_FILE" | cut -d ' ' -f 1)"
          CHANGED_FILE_COUNT="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "patch_sha256=$PATCH_SHA256" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "## Delta preparado"
            echo
            echo "- Arquivos: $CHANGED_FILE_COUNT"
            echo "- SHA-256 do patch: \`$PATCH_SHA256\`"
            echo "- Relatório: \`$IMPLEMENTATION_REPORT_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Transferir implementação para persistência
        uses: actions/upload-artifact@v7
        with:
          name: ekom-implementation-${{ github.run_id }}
          path: ${{ runner.temp }}/ekom-implementation.patch
          if-no-files-found: error
          retention-days: 1

  persist-implementation:
    name: Persistir implementação EKOM
    needs: implement
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar a branch autorizada
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.working_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Baixar patch validado
        uses: actions/download-artifact@v8
        with:
          name: ekom-implementation-${{ github.run_id }}
          path: ${{ runner.temp }}/ekom-implementation

      - name: Registrar implementação na branch
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ekom-implementation
          EXPECTED_PATCH_SHA256: ${{ needs.implement.outputs.patch_sha256 }}
          BASELINE_HEAD: ${{ needs.implement.outputs.baseline_head }}
          ANALYZED_REVISION: ${{ needs.implement.outputs.analyzed_revision }}
          IMPLEMENTATION_REPORT_PATH: ${{ needs.implement.outputs.implementation_report_path }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
          CHANGE_ID: ${{ needs.implement.outputs.change_id }}
          AUTHORIZED_BY: ${{ inputs.authorized_by }}
        run: |
          set -euo pipefail

          if [ "$(git branch --show-current)" != "$WORKING_BRANCH" ]; then
            echo "A branch de persistência não corresponde à ordem."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$BASELINE_HEAD" ]; then
            echo "A branch avançou depois da baseline implementada."
            echo "Esperada: $BASELINE_HEAD"
            echo "Atual: $(git rev-parse HEAD)"
            exit 1
          fi

          if [[ ! "$EXPECTED_PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "O job de implementação não informou SHA-256 válido."
            exit 1
          fi

          ARTIFACT_COUNT="$(find "$ARTIFACT_DIR" -type f -print | wc -l | tr -d ' ')"
          if [ "$ARTIFACT_COUNT" -ne 1 ]; then
            echo "O artefato deve conter exatamente um patch."
            exit 1
          fi

          PATCH_FILE="$(find "$ARTIFACT_DIR" -type f -print -quit)"
          if [ "$(basename "$PATCH_FILE")" != "ekom-implementation.patch" ]; then
            echo "O artefato não contém o patch esperado."
            exit 1
          fi

          ACTUAL_PATCH_SHA256="$(sha256sum "$PATCH_FILE" | cut -d ' ' -f 1)"
          if [ "$ACTUAL_PATCH_SHA256" != "$EXPECTED_PATCH_SHA256" ]; then
            echo "O patch transferido não corresponde ao delta validado."
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "A branch de persistência não iniciou limpa."
            exit 1
          fi

          git apply --check --binary "$PATCH_FILE"
          git apply --index --binary "$PATCH_FILE"

          if [ "$(git diff --cached --name-status -- "$IMPLEMENTATION_REPORT_PATH")" != \
            "A	$IMPLEMENTATION_REPORT_PATH" ]; then
            echo "O relatório de implementação não foi transferido como arquivo novo."
            exit 1
          fi

          git diff --cached --check

          git config user.name "EKOM Automation"
          git config user.email "ekom-automation@users.noreply.github.com"
          git commit -m "impl: implementa $CHANGE_ID"

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "A árvore não ficou limpa após o commit."
            git status --short --untracked-files=all
            exit 1
          fi

          git push origin "HEAD:refs/heads/$WORKING_BRANCH"

          {
            echo
            echo "## Implementação registrada"
            echo
            echo "- Branch: \`$WORKING_BRANCH\`"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo "- Revisão normativa: \`$ANALYZED_REVISION\`"
            echo "- Relatório: \`$IMPLEMENTATION_REPORT_PATH\`"
            echo "- Ordem do Arquiteto: $AUTHORIZED_BY"
            echo
            echo "## Parecer do Engenheiro Implementador"
            echo
            sed -n '/^## Gates$/,$p' "$IMPLEMENTATION_REPORT_PATH" \
              | sed -e 's/^### /#### /' -e 's/^## /### /'
          } >> "$GITHUB_STEP_SUMMARY"

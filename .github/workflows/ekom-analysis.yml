name: EKOM Analysis

run-name: "EKOM · ${{ inputs.change_id }} · ${{ inputs.phase }}"

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Identificador da demanda EKOM
        required: true
        type: string

      specification_path:
        description: Caminho da especificação EKOM
        required: true
        type: string

      phase:
        description: Fase solicitada
        required: true
        type: string

      working_branch:
        description: Branch de trabalho
        required: true
        type: string

      allow_code_changes:
        description: Autoriza alterações de código
        required: true
        type: boolean
        default: false

      require_architect_approval:
        description: Exige aprovação do Arquiteto
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-request:
    name: Validar solicitação EKOM
    runs-on:
      group: codex-trusted-runners
      labels: codex-runner
    outputs:
      report_path: ${{ steps.prepare_report.outputs.report_path }}
      report_sha256: ${{ steps.prepare_report.outputs.report_sha256 }}

    steps:
      - name: Validar controles da fase
        env:
          PHASE: ${{ inputs.phase }}
          ALLOW_CODE_CHANGES: ${{ inputs.allow_code_changes }}
          REQUIRE_ARCHITECT_APPROVAL: ${{ inputs.require_architect_approval }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          set -euo pipefail

          if [ "$PHASE" != "analysis" ]; then
            echo "O workflow de análise aceita somente a fase analysis."
            exit 1
          fi

          if [ "$ALLOW_CODE_CHANGES" != "false" ]; then
            echo "A fase analysis não permite alterações de código."
            exit 1
          fi

          if [ "$REQUIRE_ARCHITECT_APPROVAL" != "true" ]; then
            echo "A aprovação do Arquiteto é obrigatória."
            exit 1
          fi

          case "$SPECIFICATION_PATH" in
            docs/specs/*.md) ;;
            *)
              echo "A especificação deve estar em docs/specs/ e ser Markdown."
              exit 1
              ;;
          esac

          case "$WORKING_BRANCH" in
            spec/*) ;;
            *)
              echo "A análise deve usar uma branch spec/*."
              exit 1
              ;;
          esac

          git check-ref-format --branch "$WORKING_BRANCH" >/dev/null

          SPEC_NAME="$(basename "$SPECIFICATION_PATH" .md)"
          SPEC_SLUG="$(printf '%s' "$SPEC_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | tr '_' '-' \
            | sed 's/[^a-z0-9-]//g')"
          EXPECTED_BRANCH="spec/$SPEC_SLUG"

          if [ "$WORKING_BRANCH" != "$EXPECTED_BRANCH" ]; then
            echo "A branch não corresponde ao nome da especificação."
            echo "Esperada: $EXPECTED_BRANCH"
            echo "Recebida: $WORKING_BRANCH"
            exit 1
          fi

      - name: Registrar resumo
        env:
          CHANGE_ID: ${{ inputs.change_id }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          PHASE: ${{ inputs.phase }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          {
            echo "## Especificação EKOM submetida"
            echo
            echo "- Change ID: \`$CHANGE_ID\`"
            echo "- Especificação: \`$SPECIFICATION_PATH\`"
            echo "- Fase: \`$PHASE\`"
            echo "- Branch analisada: \`$WORKING_BRANCH\`"
            echo "- Alterações de código: não autorizadas"
            echo "- Aprovação do Arquiteto: obrigatória"
          } >> "$GITHUB_STEP_SUMMARY"
            
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.working_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validar identidade da especificação
        env:
          CHANGE_ID: ${{ inputs.change_id }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          set -euo pipefail

          if [ "$(git branch --show-current)" != "$WORKING_BRANCH" ]; then
            echo "A branch baixada não corresponde à submissão."
            exit 1
          fi

          if ! git merge-base origin/main HEAD >/dev/null; then
            echo "A branch submetida não possui ancestral comum com a main."
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "A análise formal exige árvore de trabalho limpa."
            git status --short --untracked-files=all
            exit 1
          fi

          if [ ! -f "$SPECIFICATION_PATH" ]; then
            echo "A especificação não existe na branch submetida."
            exit 1
          fi

          DOCUMENT_CHANGE_ID="$(
            sed -nE 's/^\*\*ID:\*\*[[:space:]]*`([^`]+)`.*/\1/p' \
              "$SPECIFICATION_PATH" | head -n 1
          )"

          if [ -z "$DOCUMENT_CHANGE_ID" ]; then
            echo "A especificação não declara o campo **ID:**."
            exit 1
          fi

          if [ "$DOCUMENT_CHANGE_ID" != "$CHANGE_ID" ]; then
            echo "O ID submetido não corresponde ao documento."
            echo "Documento: $DOCUMENT_CHANGE_ID"
            echo "Submissão: $CHANGE_ID"
            exit 1
          fi

      - name: Baixar diretrizes EKOM vigentes
        uses: actions/checkout@v5
        with:
          repository: iotsmartsys/EKM-guidelines
          ref: main
          path: .ekom-guidelines
          fetch-depth: 1
          persist-credentials: false

      - name: Executar análise EKOM
        id: codex_analysis
        env:
          CODEX_PROMPT: |
            Assuma exclusivamente o papel EKOM de Engenheiro Analista e execute
            uma análise formal de implementabilidade da versão submetida.

            Leia integralmente, nesta ordem:
            1. AGENTS.md;
            2. .ekom-guidelines/roles/REGRAS-COMUNS.md;
            3. .ekom-guidelines/roles/ENGENHEIRO-ANALISTA.md;
            4. a especificação submetida;
            5. somente as fontes técnicas e normativas pertinentes.

            REGRAS-COMUNS.md e ENGENHEIRO-ANALISTA.md são o contrato canônico
            vigente da atuação. Este prompt apenas fornece a ordem e os dados
            operacionais; se houver divergência de formato ou conteúdo, siga os
            perfis canônicos. O diretório .ekom-guidelines/ é uma dependência
            injetada pela automação, não uma alteração do projeto.

            Submissão:
            - ID: ${{ inputs.change_id }}
            - Especificação: ${{ inputs.specification_path }}
            - Branch analisada: ${{ inputs.working_branch }}

            Leia integralmente a especificação indicada. Não reconstrua o
            contrato a partir de dados do workflow. A especificação versionada
            na branch é a fonte normativa da demanda.

            Localize os relatórios de análise anteriores da mesma linhagem e
            reconcilie cada bloqueador aplicável. Mantenha durante a investigação
            o inventário de confronto exigido pelo perfil, mas não o transcreva.
            Antes de classificar como Ready, execute o challenge limitado
            determinado pelo perfil.

            Produza somente o corpo decisório do relatório, com no máximo 800
            palavras e exatamente estas cinco seções, nesta ordem:

            ## Classificação principal
            **Classificação principal:** <classificação canônica exatamente como
            nomeada no perfil; o negrito e o alias inglês são opcionais>

            ## Problemas bloqueantes
            Para cada bloqueador use `### Bloqueador N` e os campos `- Problema:`,
            `- Evidência:`, `- Impacto:` e `- Regra de bloqueio:`. Se não houver,
            escreva exatamente `Nenhum.`.

            ## Reconciliação dos bloqueadores anteriores
            Registre Mantido, Descartado ou Reclassificado como não bloqueante,
            com regra e evidência, para cada bloqueador anterior aplicável. Se
            não existir relatório anterior aplicável, escreva `Nenhum relatório
            anterior aplicável.`. Se houver relatório anterior sem bloqueador,
            escreva `Nenhum bloqueador anterior aplicável.`.

            ## Controle de cobertura e challenge
            Use quatro itens: `- Requisitos confrontados: N; lacunas: ...`,
            `- Critérios de aceite confrontados: N; lacunas: ...`,
            `- Débitos relacionados confrontados: N; lacunas: ...` e
            `- Challenge: ...`.

            ## Restrições materiais não bloqueantes
            Registre como lista de no máximo cinco itens as restrições
            indispensáveis ao handoff. Se não houver, escreva exatamente
            `Nenhuma.`.

            Use referências diretas `arquivo:linha` sempre que a fonte permitir.
            Não inclua metadados do relatório: o pipeline os acrescentará sem
            alterar o corpo decisório. Não reproduza requisitos ou inventários,
            não exponha raciocínio exploratório, não antecipe desenho de solução
            e não recomende correções, próximos passos, promoção ou implementação.

            O Codex executa dentro de um container dedicado, sem sandbox interno.
            Ainda assim, esta atuação é estritamente analítica: não altere
            arquivos, não crie branch, não implemente código, não faça commit e
            não faça push. O pipeline reprovará mecanicamente qualquer alteração
            da árvore de trabalho. Esta ordem autoriza somente o pipeline a
            persistir exatamente o corpo validado como novo relatório em
            docs/reports/. A análise informa o Arquiteto e não promove estado,
            não autoriza implementação e não declara aprovação final.
        run: |
          set -euo pipefail

          printf '%s\n' "$CODEX_PROMPT" | codex exec \
            --ephemeral \
            --model gpt-5.6-sol \
            --config 'model_reasoning_effort="medium"' \
            --sandbox danger-full-access \
            --output-last-message "$RUNNER_TEMP/ekom-analysis.md" \
            -

      - name: Confirmar imutabilidade da análise
        run: |
          set -euo pipefail

          REPOSITORY_CHANGES="$(
            git status --porcelain --untracked-files=all \
              | grep -vE '^\?\? \.ekom-guidelines/' \
              || true
          )"

          if [ -n "$REPOSITORY_CHANGES" ]; then
            echo "A análise modificou a árvore de trabalho e foi rejeitada."
            printf '%s\n' "$REPOSITORY_CHANGES"
            exit 1
          fi

      - name: Validar decisão do Engenheiro Analista
        env:
          REPORT_FILE: ${{ runner.temp }}/ekom-analysis.md
        run: |
          set -euo pipefail

          if [ ! -s "$REPORT_FILE" ]; then
            echo "O Codex não produziu um relatório de análise."
            exit 1
          fi

          WORD_COUNT="$(wc -w < "$REPORT_FILE" | tr -d ' ')"
          if [ "$WORD_COUNT" -gt 800 ]; then
            echo "O corpo da análise excede o limite EKOM de 800 palavras."
            echo "Quantidade encontrada: $WORD_COUNT"
            exit 1
          fi

          python3 - "$REPORT_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          text = report_path.read_text(encoding="utf-8")

          expected_headings = [
              "Classificação principal",
              "Problemas bloqueantes",
              "Reconciliação dos bloqueadores anteriores",
              "Controle de cobertura e challenge",
              "Restrições materiais não bloqueantes",
          ]
          headings = re.findall(r"^##\s+(.+?)\s*$", text, re.MULTILINE)
          if headings != expected_headings:
              raise SystemExit(
                  "Estrutura inválida. Seções esperadas, na ordem: "
                  + " | ".join(expected_headings)
              )

          canonical_classifications = {
              "Pronta": "Ready",
              "Não pronta — defeito da especificação": "Not Ready — Specification Defect",
              "Não pronta — pré-requisito arquitetural": "Not Ready — Architectural Prerequisite",
              "Não pronta — evidência requerida": "Not Ready — Evidence Required",
              "Não implementável — conflito de restrição": "Not Implementable — Constraint Conflict",
              "Desconhecida — impacto não delimitado": "Unknown — Impact Not Delimited",
          }
          matches = re.findall(
              r"^\*\*Classificação principal:\*\*\s*(.+?)\s*$",
              text,
              re.MULTILINE,
          )
          if len(matches) != 1:
              raise SystemExit(
                  "A análise deve declarar exatamente uma classificação principal canônica."
              )

          classification_text = re.sub(r"\*\*([^*\n]+)\*\*", r"\1", matches[0]).strip()
          classification_match = re.fullmatch(
              r"(.+?)(?:\s+\[`([^`]+)`\])?",
              classification_text,
          )
          if not classification_match:
              raise SystemExit(
                  "A análise deve declarar exatamente uma classificação principal canônica."
              )

          classification_name, supplied_alias = classification_match.groups()
          canonical_alias = canonical_classifications.get(classification_name)
          if canonical_alias is None or (
              supplied_alias is not None and supplied_alias != canonical_alias
          ):
              raise SystemExit(
                  "A análise deve declarar exatamente uma classificação principal canônica."
              )

          def section(name: str) -> str:
              match = re.search(
                  rf"^##\s+{re.escape(name)}\s*$\n(.*?)(?=^##\s+|\Z)",
                  text,
                  re.MULTILINE | re.DOTALL,
              )
              return match.group(1).strip() if match else ""

          blockers = section("Problemas bloqueantes")
          if canonical_alias == "Ready" and blockers != "Nenhum.":
              raise SystemExit("Ready exige ausência explícita de bloqueadores.")
          if canonical_alias != "Ready" and blockers == "Nenhum.":
              raise SystemExit("Classificação não Ready exige bloqueador explícito.")
          if blockers != "Nenhum.":
              blocker_parts = re.split(r"^###\s+Bloqueador\s+\d+\s*$", blockers, flags=re.MULTILINE)
              blocker_entries = [part.strip() for part in blocker_parts if part.strip()]
              declared = re.findall(r"^###\s+Bloqueador\s+\d+\s*$", blockers, re.MULTILINE)
              if not declared or len(blocker_entries) != len(declared):
                  raise SystemExit("Cada bloqueador deve usar o formato ### Bloqueador N.")
              required_fields = ("Problema", "Evidência", "Impacto", "Regra de bloqueio")
              for entry in blocker_entries:
                  for field in required_fields:
                      if not re.search(rf"^-\s+{re.escape(field)}:\s*\S", entry, re.MULTILINE):
                          raise SystemExit(f"Bloqueador sem campo obrigatório: {field}.")

          reconciliation = section("Reconciliação dos bloqueadores anteriores")
          no_previous = re.search(
              r"nenhum (?:relatório|bloqueador) anterior aplicável",
              reconciliation,
              re.IGNORECASE,
          )
          dispositions = re.findall(
              r"\b(?:Mantido|Descartado|Reclassificado como não bloqueante)\b",
              reconciliation,
          )
          if not no_previous and not dispositions:
              raise SystemExit("A reconciliação não declara disposição de bloqueadores anteriores.")

          coverage = section("Controle de cobertura e challenge").lower()
          coverage_patterns = (
              r"^-\s+requisitos confrontados:\s*\d+;\s*lacunas:\s*\S",
              r"^-\s+critérios de aceite confrontados:\s*\d+;\s*lacunas:\s*\S",
              r"^-\s+débitos relacionados confrontados:\s*\d+;\s*lacunas:\s*\S",
              r"^-\s+challenge:\s*\S",
          )
          for pattern in coverage_patterns:
              if not re.search(pattern, coverage, re.MULTILINE):
                  raise SystemExit("O controle de cobertura/challenge está incompleto.")

          restrictions = section("Restrições materiais não bloqueantes")
          if restrictions != "Nenhuma.":
              restriction_items = re.findall(r"^-\s+\S.*$", restrictions, re.MULTILINE)
              non_list_content = re.sub(r"^-\s+\S.*$", "", restrictions, flags=re.MULTILINE).strip()
              if not 1 <= len(restriction_items) <= 5 or non_list_content:
                  raise SystemExit("As restrições devem formar uma lista de um a cinco itens.")
          PY

          {
            echo
            echo "## Decisão normativa validada"
            echo
            echo "- Estrutura do perfil Engenheiro Analista: válida"
            echo "- Palavras: $WORD_COUNT/800"
            echo "- Tamanho: $(wc -c < "$REPORT_FILE") bytes"
            echo "- SHA-256: \`$(sha256sum "$REPORT_FILE" | cut -d ' ' -f 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Preparar relatório versionado
        id: prepare_report
        env:
          SOURCE_REPORT: ${{ runner.temp }}/ekom-analysis.md
          CHANGE_ID: ${{ inputs.change_id }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          set -euo pipefail

          SPEC_NAME="$(basename "$SPECIFICATION_PATH" .md)"
          SPEC_SLUG="$(printf '%s' "$SPEC_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | tr '_' '-' \
            | sed 's/[^a-z0-9-]//g')"

          if [ -z "$SPEC_SLUG" ]; then
            echo "Não foi possível derivar o domínio do relatório."
            exit 1
          fi

          RUN_TIMESTAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          ANALYZED_REVISION="$(git rev-parse HEAD)"
          REVISION="$(git rev-parse --short=7 HEAD)"
          REPORT_DIR="docs/reports/$SPEC_SLUG/analysis"
          REPORT_PATH="$REPORT_DIR/${RUN_TIMESTAMP}-${REVISION}-${GITHUB_RUN_ID}-implementability-analysis.md"

          mkdir -p "$REPORT_DIR"

          {
            printf '# Análise de implementabilidade — %s\n\n' "$CHANGE_ID"
            printf '**Classe da fonte:** Relatório\n\n'
            printf '**Papel:** Engenheiro Analista\n\n'
            printf '**Especificação:** `%s`\n\n' "$SPECIFICATION_PATH"
            printf '**Revisão confrontada:** `%s`\n\n' "$ANALYZED_REVISION"
            printf '**Estado:** Concluído\n\n'
            printf '**Branch analisada:** `%s`\n\n' "$WORKING_BRANCH"
            printf '**Execução do GitHub Actions:** `%s`\n\n' "$GITHUB_RUN_ID"
            printf '**Data da análise:** `%s`\n\n' "$RUN_TIMESTAMP"
            printf '%s\n\n' '---'
            cat "$SOURCE_REPORT"
            printf '\n'
          } > "$REPORT_PATH"          
          sed -i 's/[[:blank:]]\+$//' "$REPORT_PATH"          

          python3 tools/validate_ekom_documents.py . "$REPORT_PATH"

          STATUS="$(git status --porcelain --untracked-files=all \
            | grep -vE '^\?\? \.ekom-guidelines/$' || true)"

          if [ "$STATUS" != "?? $REPORT_PATH" ]; then
            echo "Foram encontradas alterações fora do relatório autorizado:"
            printf '%s\n' "$STATUS"
            exit 1
          fi

          if [ ! -s "$REPORT_PATH" ]; then
            echo "O relatório versionado ficou vazio."
            exit 1
          fi

          REPORT_SHA256="$(sha256sum "$REPORT_PATH" | cut -d ' ' -f 1)"

          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "report_sha256=$REPORT_SHA256" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "## Relatório preparado para versionamento"
            echo
            echo "- Caminho: \`$REPORT_PATH\`"
            echo "- Revisão analisada: \`$REVISION\`"
            echo "- Tamanho: $(wc -c < "$REPORT_PATH") bytes"
            echo "- SHA-256: \`$REPORT_SHA256\`"
            echo "- Nenhum outro arquivo foi alterado"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Transferir relatório para persistência
        uses: actions/upload-artifact@v7
        with:
          name: ekom-analysis-${{ github.run_id }}
          path: ${{ steps.prepare_report.outputs.report_path }}
          if-no-files-found: error
          retention-days: 1

  persist-report:
    name: Persistir relatório EKOM
    needs: validate-request
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar a branch da especificação
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.working_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Baixar relatório analisado
        uses: actions/download-artifact@v8
        with:
          name: ekom-analysis-${{ github.run_id }}
          path: ${{ runner.temp }}/ekom-analysis

      - name: Registrar relatório na branch da especificação
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ekom-analysis
          REPORT_PATH: ${{ needs.validate-request.outputs.report_path }}
          EXPECTED_SHA256: ${{ needs.validate-request.outputs.report_sha256 }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
          CHANGE_ID: ${{ inputs.change_id }}
        run: |
          set -euo pipefail

          case "$WORKING_BRANCH" in
            spec/*) ;;
            *)
              echo "O relatório somente pode ser registrado em branch spec/*."
              exit 1
              ;;
          esac

          git check-ref-format --branch "$WORKING_BRANCH" >/dev/null

          ACTUAL_BRANCH="$(git branch --show-current)"

          if [ "$ACTUAL_BRANCH" != "$WORKING_BRANCH" ]; then
            echo "A branch efetivamente baixada não corresponde à submissão."
            echo "Esperada: $WORKING_BRANCH"
            echo "Atual: $ACTUAL_BRANCH"
            exit 1
          fi

          if [ -z "$REPORT_PATH" ]; then
            echo "O job de análise não informou o caminho do relatório."
            exit 1
          fi

          if [[ ! "$REPORT_PATH" =~ ^docs/reports/[a-z0-9-]+/analysis/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}Z-[0-9a-f]{7}-[0-9]+-implementability-analysis\.md$ ]]; then
            echo "O destino do relatório está fora do padrão autorizado."
            exit 1
          fi

          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "O job de análise não informou um SHA-256 válido."
            exit 1
          fi

          if [ -e "$REPORT_PATH" ]; then
            echo "O relatório de destino já existe e não será sobrescrito."
            exit 1
          fi

          mapfile -t ARTIFACT_FILES < <(
            find "$ARTIFACT_DIR" -type f -print
          )

          if [ "${#ARTIFACT_FILES[@]}" -ne 1 ]; then
            echo "O artefato deve conter exatamente um arquivo."
            printf 'Quantidade encontrada: %s\n' "${#ARTIFACT_FILES[@]}"
            exit 1
          fi

          SOURCE_REPORT="${ARTIFACT_FILES[0]}"

          if [ ! -s "$SOURCE_REPORT" ]; then
            echo "O relatório transferido está vazio."
            exit 1
          fi

          if [ "$(basename "$SOURCE_REPORT")" != "$(basename "$REPORT_PATH")" ]; then
            echo "O nome do artefato não corresponde ao relatório autorizado."
            exit 1
          fi

          ACTUAL_SHA256="$(sha256sum "$SOURCE_REPORT" | cut -d ' ' -f 1)"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "O conteúdo transferido não corresponde ao relatório analisado."
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "A branch de persistência não iniciou com árvore limpa."
            git status --short --untracked-files=all
            exit 1
          fi

          mkdir -p "$(dirname "$REPORT_PATH")"
          install -m 0644 "$SOURCE_REPORT" "$REPORT_PATH"

          STATUS="$(git status --porcelain --untracked-files=all)"

          if [ "$STATUS" != "?? $REPORT_PATH" ]; then
            echo "Foram encontradas alterações fora do relatório autorizado:"
            printf '%s\n' "$STATUS"
            exit 1
          fi

          git add -- "$REPORT_PATH"

          STAGED_FILES="$(git diff --cached --name-only)"

          if [ "$STAGED_FILES" != "$REPORT_PATH" ]; then
            echo "O commit contém arquivos fora do relatório autorizado:"
            printf '%s\n' "$STAGED_FILES"
            exit 1
          fi

          STAGED_STATUS="$(git diff --cached --name-status)"
          if [ "$STAGED_STATUS" != "A	$REPORT_PATH" ]; then
            echo "O relatório formal deve ser um arquivo novo e imutável."
            printf '%s\n' "$STAGED_STATUS"
            exit 1
          fi

          git diff --cached --check

          git config user.name "EKOM Automation"
          git config user.email "ekom-automation@users.noreply.github.com"

          git commit \
            -m "docs: registra análise de implementabilidade $CHANGE_ID"

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "A árvore não ficou limpa após o commit do relatório."
            git status --short --untracked-files=all
            exit 1
          fi

          git push origin "HEAD:refs/heads/$WORKING_BRANCH"

          {
            echo
            echo "## Relatório registrado"
            echo
            echo "- Arquivo: \`$REPORT_PATH\`"
            echo "- Branch: \`$WORKING_BRANCH\`"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo
            echo "## Parecer do Engenheiro Analista"
            echo
            sed -n '/^## Classificação principal$/,$p' "$REPORT_PATH" \
              | sed -e 's/^### /#### /' -e 's/^## /### /'
          } >> "$GITHUB_STEP_SUMMARY"

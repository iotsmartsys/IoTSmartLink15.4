name: EKOM Pilot

run-name: "EKOM · ${{ inputs.change_id }} · ${{ inputs.phase }}"

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Identificador da demanda EKOM
        required: true
        type: string

      specification_path:
        description: Caminho da especificação EKOM
        required: true
        type: string

      phase:
        description: Fase solicitada
        required: true
        type: string

      working_branch:
        description: Branch de trabalho
        required: true
        type: string

      allow_code_changes:
        description: Autoriza alterações de código
        required: true
        type: boolean
        default: false

      require_architect_approval:
        description: Exige aprovação do Arquiteto
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-request:
    name: Validar solicitação EKOM
    runs-on: ubuntu-latest
    env:
      RTK_TELEMETRY_DISABLED: "1"

    steps:
      - name: Validar controles da fase
        env:
          PHASE: ${{ inputs.phase }}
          ALLOW_CODE_CHANGES: ${{ inputs.allow_code_changes }}
          REQUIRE_ARCHITECT_APPROVAL: ${{ inputs.require_architect_approval }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          set -euo pipefail

          if [ "$PHASE" != "analysis" ]; then
            echo "Esta versão do piloto aceita somente a fase analysis."
            exit 1
          fi

          if [ "$ALLOW_CODE_CHANGES" != "false" ]; then
            echo "A fase analysis não permite alterações de código."
            exit 1
          fi

          if [ "$REQUIRE_ARCHITECT_APPROVAL" != "true" ]; then
            echo "A aprovação do Arquiteto é obrigatória."
            exit 1
          fi

          if [ "$WORKING_BRANCH" = "main" ]; then
            echo "A análise deve usar uma branch de trabalho."
            exit 1
          fi

          case "$SPECIFICATION_PATH" in
            docs/specs/*.md) ;;
            *)
              echo "A especificação deve estar em docs/specs/ e ser Markdown."
              exit 1
              ;;
          esac

      - name: Registrar resumo
        env:
          CHANGE_ID: ${{ inputs.change_id }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          PHASE: ${{ inputs.phase }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          {
            echo "## Especificação EKOM submetida"
            echo
            echo "- Change ID: \`$CHANGE_ID\`"
            echo "- Especificação: \`$SPECIFICATION_PATH\`"
            echo "- Fase: \`$PHASE\`"
            echo "- Branch analisada: \`$WORKING_BRANCH\`"
            echo "- Alterações de código: não autorizadas"
            echo "- Aprovação do Arquiteto: obrigatória"
          } >> "$GITHUB_STEP_SUMMARY"
            
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.working_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar diretrizes EKOM vigentes
        uses: actions/checkout@v5
        with:
          repository: iotsmartsys/EKM-guidelines
          ref: main
          path: .ekom-guidelines
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar RTK para leitura compacta
        env:
          RTK_VERSION: 0.45.0
          RTK_SHA256: c4c036fbf181fc55ef329786c8c17e0d427972b053b825944d968a6aafef1ba4
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/rtk.tar.gz"
          install_dir="$RUNNER_TEMP/rtk-bin"

          curl --fail --silent --show-error --location \
            "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/rtk-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"

          echo "$RTK_SHA256  $archive" | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          chmod 0755 "$install_dir/rtk"

          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/rtk" --version

      - name: Executar análise EKOM
        id: codex_analysis
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          codex-args: '["--ephemeral"]'
          prompt: |
            Atue somente na fase de análise de implementabilidade da versão
            vigente do EKOM.

            Leia primeiro o AGENTS.md do projeto e siga todas as instruções aplicáveis. As diretrizes canônicas vigentes estão disponíveis em .ekom-guidelines/. Use esse caminho no ambiente da Action quando o AGENTS.md mencionar a instalação local externa.

            Submissão:
            - ID: ${{ inputs.change_id }}
            - Especificação: ${{ inputs.specification_path }}
            - Branch analisada: ${{ inputs.working_branch }}

            Leia integralmente a especificação indicada. Não reconstrua o
            contrato a partir de dados do workflow. A especificação versionada
            na branch é a fonte normativa da demanda.

            Política de leitura e economia de contexto:
            - Leia integralmente e uma única vez, nesta ordem: `AGENTS.md`,
              `.ekom-guidelines/roles/REGRAS-COMUNS.md`,
              `.ekom-guidelines/roles/ENGENHEIRO-ANALISTA.md` e a especificação
              submetida. Leia um documento completo por comando, do início ao
              EOF; não carregue o perfil do Autor nesta atuação de Análise.
            - Não use RTK para comprimir esses quatro documentos obrigatórios.
              Não os concatene, não os releia e não repita seu conteúdo apenas
              para obter números de linha.
            - Para descoberta, use somente a sintaxe suportada, sem flags de
              `rg` ou `grep`: `rtk ls <caminho>`, `rtk grep "<padrão>" <caminhos>`,
              `rtk git status`, `rtk git log` e `rtk git diff`.
            - Use o mapa, as relações declaradas e buscas compactas para localizar
              nas demais autoridades somente as seções pertinentes ao recorte.
              Leia trechos exatos com `sed -n`. Amplie para o documento completo
              apenas quando os trechos não bastarem para decidir uma relação,
              conflito ou bloqueador material.
            - Para código, localize primeiro os símbolos com RTK e depois leia
              somente os trechos exatos necessários. Se precisar citar linhas,
              numere apenas esses trechos; não releia o arquivo inteiro.
            - Evite listagens completas do repositório, buscas com centenas de
              resultados e comandos que concatenem muitos arquivos.

            Confronte a especificação com as autoridades, arquitetura,
            precedentes e código existentes e apresente:

            1. fontes normativas e elementos afetados;
            2. relação da mudança com cada autoridade vigente;
            3. componentes e arquivos potencialmente impactados;
            4. comportamento existente relevante;
            5. restrições, incertezas e decisões necessárias;
            6. experimentos e evidências necessários;
            7. classificação de implementabilidade conforme o EKOM vigente.

            Não altere arquivos, não crie branch, não implemente código, não
            faça commit e não faça push. Sua resposta é apenas a análise para
            avaliação do Arquiteto.

      - name: Registrar economia estimada do RTK
        if: always()
        run: |
          {
            echo "## RTK — economia estimada de saída"
            echo
            rtk gain --all --format json || true
          } >> "$GITHUB_STEP_SUMMARY"

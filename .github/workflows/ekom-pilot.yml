name: EKOM Pilot

run-name: "EKOM · ${{ inputs.change_id }} · ${{ inputs.phase }}"

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Identificador da demanda EKOM
        required: true
        type: string

      specification_path:
        description: Caminho da especificação EKOM
        required: true
        type: string

      phase:
        description: Fase solicitada
        required: true
        type: string

      working_branch:
        description: Branch de trabalho
        required: true
        type: string

      allow_code_changes:
        description: Autoriza alterações de código
        required: true
        type: boolean
        default: false

      require_architect_approval:
        description: Exige aprovação do Arquiteto
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-request:
    name: Validar solicitação EKOM
    runs-on: ubuntu-latest

    steps:
      - name: Validar controles da fase
        env:
          PHASE: ${{ inputs.phase }}
          ALLOW_CODE_CHANGES: ${{ inputs.allow_code_changes }}
          REQUIRE_ARCHITECT_APPROVAL: ${{ inputs.require_architect_approval }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          set -euo pipefail

          if [ "$PHASE" != "analysis" ]; then
            echo "Esta versão do piloto aceita somente a fase analysis."
            exit 1
          fi

          if [ "$ALLOW_CODE_CHANGES" != "false" ]; then
            echo "A fase analysis não permite alterações de código."
            exit 1
          fi

          if [ "$REQUIRE_ARCHITECT_APPROVAL" != "true" ]; then
            echo "A aprovação do Arquiteto é obrigatória."
            exit 1
          fi

          if [ "$WORKING_BRANCH" = "main" ]; then
            echo "A análise deve usar uma branch de trabalho."
            exit 1
          fi

          case "$SPECIFICATION_PATH" in
            docs/specs/*.md) ;;
            *)
              echo "A especificação deve estar em docs/specs/ e ser Markdown."
              exit 1
              ;;
          esac

      - name: Registrar resumo
        env:
          CHANGE_ID: ${{ inputs.change_id }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          PHASE: ${{ inputs.phase }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          {
            echo "## Especificação EKOM submetida"
            echo
            echo "- Change ID: \`$CHANGE_ID\`"
            echo "- Especificação: \`$SPECIFICATION_PATH\`"
            echo "- Fase: \`$PHASE\`"
            echo "- Branch analisada: \`$WORKING_BRANCH\`"
            echo "- Alterações de código: não autorizadas"
            echo "- Aprovação do Arquiteto: obrigatória"
          } >> "$GITHUB_STEP_SUMMARY"
            
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.working_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar diretrizes EKOM vigentes
        uses: actions/checkout@v5
        with:
          repository: iotsmartsys/EKM-guidelines
          ref: main
          path: .ekom-guidelines
          fetch-depth: 1
          persist-credentials: false

      - name: Executar análise EKOM
        id: codex_analysis
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          codex-args: '["--ephemeral"]'
          output-file: ${{ runner.temp }}/ekom-analysis.md
          prompt: |
            Atue somente na fase de autoria e análise de implementabilidadeda versão vigente do EKOM.

            Leia primeiro o AGENTS.md do projeto e siga todas as instruções aplicáveis. As diretrizes canônicas vigentes estão disponíveis em .ekom-guidelines/. Use esse caminho no ambiente da Action quando o AGENTS.md mencionar a instalação local externa.

            Submissão:
            - ID: ${{ inputs.change_id }}
            - Especificação: ${{ inputs.specification_path }}
            - Branch analisada: ${{ inputs.working_branch }}

            Leia integralmente a especificação indicada. Não reconstrua o
            contrato a partir de dados do workflow. A especificação versionada
            na branch é a fonte normativa da demanda.

            Confronte a especificação com as autoridades, arquitetura,
            precedentes e código existentes e apresente:

            1. fontes normativas e elementos afetados;
            2. relação da mudança com cada autoridade vigente;
            3. componentes e arquivos potencialmente impactados;
            4. comportamento existente relevante;
            5. restrições, incertezas e decisões necessárias;
            6. experimentos e evidências necessários;
            7. classificação de implementabilidade conforme o EKOM vigente.

            Não altere arquivos, não crie branch, não implemente código, não
            faça commit e não faça push. Sua resposta é apenas a análise para
            avaliação do Arquiteto.

      - name: Validar relatório gerado
        env:
          REPORT_FILE: ${{ runner.temp }}/ekom-analysis.md
        run: |
          set -euo pipefail

          if [ ! -s "$REPORT_FILE" ]; then
            echo "O Codex não produziu um relatório de análise."
            exit 1
          fi

          {
            echo
            echo "## Relatório produzido"
            echo
            echo "- Arquivo temporário criado com sucesso"
            echo "- Tamanho: $(wc -c < "$REPORT_FILE") bytes"
            echo "- SHA-256: \`$(sha256sum "$REPORT_FILE" | cut -d ' ' -f 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Preparar relatório versionado
        id: prepare_report
        env:
          SOURCE_REPORT: ${{ runner.temp }}/ekom-analysis.md
          CHANGE_ID: ${{ inputs.change_id }}
          SPECIFICATION_PATH: ${{ inputs.specification_path }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          set -euo pipefail

          SPEC_NAME="$(basename "$SPECIFICATION_PATH" .md)"
          SPEC_SLUG="$(printf '%s' "$SPEC_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | tr '_' '-' \
            | sed 's/[^a-z0-9-]//g')"

          if [ -z "$SPEC_SLUG" ]; then
            echo "Não foi possível derivar o domínio do relatório."
            exit 1
          fi

          RUN_DATE="$(date -u +%F)"
          REVISION="$(git rev-parse --short=7 HEAD)"
          REPORT_DIR="docs/reports/$SPEC_SLUG/analysis"
          REPORT_PATH="$REPORT_DIR/${RUN_DATE}-${REVISION}-run-${GITHUB_RUN_ID}-implementability-analysis.md"

          mkdir -p "$REPORT_DIR"

          {
            printf '# Análise de implementabilidade — %s\n\n' "$CHANGE_ID"
            printf '**Especificação:** `%s`\n\n' "$SPECIFICATION_PATH"
            printf '**Branch analisada:** `%s`\n\n' "$WORKING_BRANCH"
            printf '**Revisão analisada:** `%s`\n\n' "$REVISION"
            printf '**Execução do GitHub Actions:** `%s`\n\n' "$GITHUB_RUN_ID"
            printf '**Data da análise:** `%s`\n\n' "$RUN_DATE"
            printf '%s\n\n' '---'
            printf '## Relatório do Engenheiro Analista\n\n'
            printf '%s\n' "$(cat "$SOURCE_REPORT")"
          } > "$REPORT_PATH"

          STATUS="$(git status --porcelain --untracked-files=all \
            | grep -vE '^\?\? \.ekom-guidelines/$' || true)"

          if [ "$STATUS" != "?? $REPORT_PATH" ]; then
            echo "Foram encontradas alterações fora do relatório autorizado:"
            printf '%s\n' "$STATUS"
            exit 1
          fi

          if [ ! -s "$REPORT_PATH" ]; then
            echo "O relatório versionado ficou vazio."
            exit 1
          fi

          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "## Relatório preparado para versionamento"
            echo
            echo "- Caminho: \`$REPORT_PATH\`"
            echo "- Revisão analisada: \`$REVISION\`"
            echo "- Tamanho: $(wc -c < "$REPORT_PATH") bytes"
            echo "- Nenhum outro arquivo foi alterado"
          } >> "$GITHUB_STEP_SUMMARY"
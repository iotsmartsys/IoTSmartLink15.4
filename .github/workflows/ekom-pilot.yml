name: EKOM Pilot

run-name: "EKOM · ${{ inputs.change_id }} · ${{ inputs.phase }}"

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Identificador da demanda EKOM
        required: true
        type: string

      title:
        description: Título da demanda
        required: true
        type: string

      request:
        description: Descrição da necessidade
        required: true
        type: string

      phase:
        description: Fase solicitada
        required: true
        type: string

      working_branch:
        description: Branch de trabalho
        required: true
        type: string

      allow_code_changes:
        description: Autoriza alterações de código
        required: true
        type: boolean
        default: false

      require_architect_approval:
        description: Exige aprovação do Arquiteto
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-request:
    name: Validar solicitação EKOM
    runs-on: ubuntu-latest

    steps:
      - name: Validar controles da fase
        env:
          PHASE: ${{ inputs.phase }}
          ALLOW_CODE_CHANGES: ${{ inputs.allow_code_changes }}
          REQUIRE_ARCHITECT_APPROVAL: ${{ inputs.require_architect_approval }}
        run: |
          set -euo pipefail

          if [ "$PHASE" != "analysis" ]; then
            echo "Esta versão do piloto aceita somente a fase analysis."
            exit 1
          fi

          if [ "$ALLOW_CODE_CHANGES" != "false" ]; then
            echo "A fase analysis não permite alterações de código."
            exit 1
          fi

          if [ "$REQUIRE_ARCHITECT_APPROVAL" != "true" ]; then
            echo "A aprovação do Arquiteto é obrigatória."
            exit 1
          fi

      - name: Registrar resumo
        env:
          CHANGE_ID: ${{ inputs.change_id }}
          TITLE: ${{ inputs.title }}
          PHASE: ${{ inputs.phase }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          {
            echo "## Solicitação EKOM recebida"
            echo
            echo "- Change ID: \`$CHANGE_ID\`"
            echo "- Título: $TITLE"
            echo "- Fase: \`$PHASE\`"
            echo "- Branch planejada: \`$WORKING_BRANCH\`"
            echo "- Alterações de código: não autorizadas"
            echo "- Aprovação do Arquiteto: obrigatória"
          } >> "$GITHUB_STEP_SUMMARY"
            
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar diretrizes EKOM vigentes
        uses: actions/checkout@v5
        with:
          repository: iotsmartsys/EKM-guidelines
          ref: main
          path: .ekom-guidelines
          fetch-depth: 1
          persist-credentials: false

      - name: Executar análise EKOM
        id: codex_analysis
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          codex-args: '["--ephemeral"]'
          prompt: |
            Atue somente na fase de autoria e análise de implementabilidadeda versão vigente do EKOM.

            Leia primeiro o AGENTS.md do projeto e siga todas as instruções aplicáveis. As diretrizes canônicas vigentes estão disponíveis em .ekom-guidelines/. Use esse caminho no ambiente da Action quando o AGENTS.md mencionar a instalação local externa.

            Demanda:
            - ID: ${{ inputs.change_id }}
            - Título: ${{ inputs.title }}
            - Necessidade: ${{ inputs.request }}
            - Branch planejada: ${{ inputs.working_branch }}

            Contrato funcional confirmado:
            - capability: battery_level;
            - valor percentual inteiro entre 0 e 100;
            - direção: cliente para coordenador;
            - reportada junto ao ciclo normal de report do dispositivo;
            - não criar comunicação adicional apenas para a bateria;
            - não é endpoint HTTP;
            - conversão física para percentual não deve ser inventada se o
              repositório não fornecer contrato suficiente.

            Investigue o repositório e apresente:
            1. componentes e arquivos potencialmente impactados;
            2. comportamento existente relevante;
            3. restrições e precedentes arquiteturais;
            4. incertezas e decisões ainda necessárias;
            5. experimentos e evidências necessários;
            6. avaliação de implementabilidade;
            7. proposta de conteúdo para a especificação EKOM.

            Não altere arquivos, não crie branch, não implemente código, não
            faça commit e não faça push. Sua resposta é apenas uma análise
            para avaliação do Arquiteto.
